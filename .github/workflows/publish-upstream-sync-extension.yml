name: Publish upstream sync extension

on:
  push:
    tags:
      - 'upstream-sync-v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (upstream-sync-vX.Y.Z)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'

      - name: Resolve version
        id: version
        shell: bash
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          if [[ ! "$TAG" =~ ^upstream-sync-v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::invalid upstream sync tag: $TAG"
            exit 1
          fi
          VERSION="${TAG#upstream-sync-v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build and test
        working-directory: tools/sub2api-sync-extension
        run: |
          npm test
          node -e '
            const fs = require("fs");
            const manifest = JSON.parse(fs.readFileSync("dist/manifest.json", "utf8"));
            manifest.version = process.env.VERSION;
            fs.writeFileSync("dist/manifest.json", JSON.stringify(manifest, null, 2) + "\n");
          '
        env:
          VERSION: ${{ steps.version.outputs.version }}

      - name: Package and hash
        working-directory: tools/sub2api-sync-extension
        shell: bash
        run: |
          ARCHIVE="newapi-sub2api-sync-extension-v${{ steps.version.outputs.version }}.zip"
          (cd dist && zip -qr "../$ARCHIVE" .)
          sha256sum "$ARCHIVE" > "$ARCHIVE.sha256"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v3.0.1
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: New API Sub2API Sync v${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: |
            tools/sub2api-sync-extension/newapi-sub2api-sync-extension-v${{ steps.version.outputs.version }}.zip
            tools/sub2api-sync-extension/newapi-sub2api-sync-extension-v${{ steps.version.outputs.version }}.zip.sha256
